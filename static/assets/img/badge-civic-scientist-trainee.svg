    <text x="75" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#0055CC" letter-spacing="0.5">SCIENTIST</text>
    <text x="75" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1A1A1A" letter-spacing="1.5">IN TRAINING</text>
