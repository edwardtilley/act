<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 160" width="150" height="150" role="img" aria-label="Professional Civic Scientist trainee certification badge">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f4d058"/>
      <stop offset="100%" stop-color="#b8912f"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0055CC"/>
      <stop offset="100%" stop-color="#003d95"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
