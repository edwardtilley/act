{% load translate_en %}
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">{% tr "Candidate Name" %} <span class="text-danger">*</span></label>
    <input type="text" class="form-control" name="candidate_name" value="{{ r.candidate_name|default:'' }}" required>
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">{% tr "Photo" %}</label>
    <input type="file" class="form-control" name="candidate_photo" accept="image/*">
    {% if r.candidate_photo %}<small class="text-muted">{% tr "Current:" %} {{ r.candidate_photo }}</small>{% endif %}
  </div>
</div>
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">{% tr "Status" %}</label>
    <select class="form-select" name="candidate_status">
      {% for value, label in status_choices %}
      <option value="{{ value }}" {% if r.candidate_status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">{% tr "Certification" %}</label>
    <select class="form-select" name="candidate_certification">
      <option value="" {% if not r.candidate_certification %}selected{% endif %}>{% tr "None" %}</option>
      <option value="trainee" {% if r.candidate_certification == 'trainee' %}selected{% endif %}>{% tr "Trainee" %}</option>
      <option value="graduate" {% if r.candidate_certification == 'graduate' %}selected{% endif %}>{% tr "Professional Civic Scientist" %}</option>
    </select>
  </div>
</div>
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">{% tr "Date Accepted" %}</label>
    <input type="date" class="form-control" name="candidate_accepted_at" value="{{ r.candidate_accepted_at|date:'Y-m-d' }}">
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">{% tr "Accepted By" %}</label>
    <input type="text" class="form-control" name="candidate_accepted_by" value="{{ r.candidate_accepted_by|default:'' }}" placeholder="{% tr 'Name of accepting official' %}">
  </div>
</div>
<div class="mb-3">
  <label class="form-label">{% tr "Bio" %}</label>
  <textarea class="form-control" name="candidate_bio" rows="3">{{ r.candidate_bio|default:'' }}</textarea>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="candidate_elected" id="elected-{{ r.id|default:'new' }}" {% if r.candidate_elected %}checked{% endif %}>
  <label class="form-check-label text-sm" for="elected-{{ r.id|default:'new' }}">{% tr "Elected" %}</label>
</div>
